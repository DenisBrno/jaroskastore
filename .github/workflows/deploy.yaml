# Pushing a v* tag runs tests, builds and pushes the image, then waits for
# approval on the "production" environment before deploying with Helm.
# Run manually with an existing tag to redeploy or roll back without rebuilding.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)deploy, e.g. v1.2.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: denisbalint/jaroskastore-app
  RELEASE: jaroskastore
  NAMESPACE: jaroskastore

jobs:
  test:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Schema tests
        working-directory: app
        run: |
          docker compose -f docker-compose.test.yml run --rm test; status=$?
          docker compose -f docker-compose.test.yml down -v
          exit $status

  build:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: app
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    # Runs after a successful build, or directly on a manual run (where build is skipped)
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: azure/setup-helm@v4

      - name: Deploy
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          export KUBECONFIG="$RUNNER_TEMP/kubeconfig"
          printf '%s' "$KUBECONFIG_DATA" > "$KUBECONFIG"
          chmod 600 "$KUBECONFIG"

          helm repo add helmforge https://repo.helmforge.dev
          helm dependency build helm
          helm upgrade --install "$RELEASE" helm \
            --namespace "$NAMESPACE" \
            --set image.tag="$TAG" \
            --set image.pullPolicy=IfNotPresent \
            --atomic --wait --timeout 5m
