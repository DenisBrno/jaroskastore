name: Deploy Web

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/ubuntu/jaroskastore
            GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github-actions-deploy -o StrictHostKeyChecking=accept-new" git fetch origin master
            GIT_SSH_COMMAND="ssh -i /home/ubuntu/.ssh/github-actions-deploy -o StrictHostKeyChecking=accept-new" git reset --hard origin/master