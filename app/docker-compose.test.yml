# Throwaway PostgreSQL with the schema from migrations/ + test runner.
#   npm run test:docker   (runs the tests, then removes the db container and volumes)
# Own project name: sharing the dev project would replace and then remove the dev db container
name: jaroskastore-test

services:
  db:
    # Same major version as the HelmForge postgresql chart in production
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: jaroskastore
      POSTGRES_USER: jaroskastore_user
      POSTGRES_PASSWORD: ${DB_PASS}
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "jaroskastore_user", "-d", "jaroskastore"]
      interval: 2s
      retries: 30

  test:
    image: node:26-alpine
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: jaroskastore
      DB_USER: jaroskastore_user
      DB_PASS: ${DB_PASS}
    volumes:
      - ./:/app:z
      - /app/node_modules
    # Same migrations the app runs on startup, no seed data
    command: sh -c "npm ci --no-audit --no-fund && npx db-migrate up -e dev && npm test"
    depends_on:
      db:
        condition: service_healthy
