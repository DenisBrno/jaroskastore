{{- $secretName := "jaroskastore-postgresql" -}}
{{- $userPassword := randAlphaNum 32 -}}
{{- $postgresPassword := randAlphaNum 32 -}}

{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- if $existingSecret -}}
  {{- if hasKey $existingSecret.data "user-password" -}}
    {{- $userPassword = index $existingSecret.data "user-password" | b64dec -}}
  {{- end -}}
  {{- if hasKey $existingSecret.data "postgres-password" -}}
    {{- $postgresPassword = index $existingSecret.data "postgres-password" | b64dec -}}
  {{- end -}}
{{- end -}}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "jaroskastore.labels" . | nindent 4 }}
type: Opaque
stringData:
  user-password: {{ $userPassword | quote }}
  postgres-password: {{ $postgresPassword | quote }}
---
{{- $appSecretName := "jaroskastore-app" }}
{{- $sessionSecret := randAlphaNum 64 -}}
{{- $ntfyPassword := .Values.ntfy.password -}}

{{- $existingAppSecret := lookup "v1" "Secret" .Release.Namespace $appSecretName -}}
{{- if $existingAppSecret -}}
  {{- if hasKey $existingAppSecret.data "session-secret" -}}
    {{- $sessionSecret = index $existingAppSecret.data "session-secret" | b64dec -}}
  {{- end -}}
  {{- if and (not $ntfyPassword) (hasKey $existingAppSecret.data "ntfy-password") -}}
    {{- $ntfyPassword = index $existingAppSecret.data "ntfy-password" | b64dec -}}
  {{- end -}}
{{- end }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ $appSecretName }}
  labels:
    {{- include "jaroskastore.labels" . | nindent 4 }}
type: Opaque
stringData:
  session-secret: {{ $sessionSecret | quote }}
  ntfy-password: {{ $ntfyPassword | quote }}
